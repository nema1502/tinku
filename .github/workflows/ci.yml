name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: package.json's "packageManager" field is the
      # single source of truth, and setting both makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The fairness claims are the product, so these run on every push.
      # Includes the uniformity assertion over 20k derivations.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
